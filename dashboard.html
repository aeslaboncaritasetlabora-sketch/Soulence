<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULENCE - Make Friends</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
    <div class="app-container">
        <!-- Search Modal -->
        <div class="search-modal" id="searchModal">
            <div class="search-container">
                <div class="search-header">
                    <h3>Search Friends</h3>
                    <button class="close-search" onclick="closeSearch()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" placeholder="Search by name..." id="searchInput">
                    <button class="search-icon-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="search-results">
                    <div class="search-result-item">
                        <img src="https://i.pinimg.com/736x/4f/4a/80/4f4a80040437d1cd400a2b5d4e0ae5a4.jpg" alt="User">
                        <div class="result-info">
                            <h4>Kurt</h4>
                            <p>Active now</p>
                        </div>
                    </div>
                    <div class="search-result-item">
                        <img src="https://i.pinimg.com/736x/00/0f/10/000f1065f05673af5afada579a86b865.jpg" alt="User">
                        <div class="result-info">
                            <h4>Clyde</h4>
                            <p>Active 2m ago</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <header class="header">
            <div class="logo">SOULENCE</div>
            <div class="header-icons">
                <a href="/profile/index.html">
                    <button class="icon-btn" onclick="alert('Profile clicked')">
                    <i class="fas fa-user-circle"></i>
                </button>
                </a>
                <a href="/EMAIL CODE/notification/notification.html">
                    <button class="icon-btn notification-icon" onclick="alert('Notifications clicked')">
                    <i class="far fa-bell"></i>
                    <span class="badge">1</span>
                </button>
                </a>
            </div>
        </header>

        <div class="stories-container">
            <div class="story">
                <div class="story-avatar">
                    <img src="https://i.pinimg.com/736x/4f/4a/80/4f4a80040437d1cd400a2b5d4e0ae5a4.jpg" alt="Kurt">
                </div>
                <span class="active-status"><span class="dot"></span>Active now</span>
            </div>
            <div class="story">
                <div class="story-avatar">
                    <img src="https://i.pinimg.com/736x/00/0f/10/000f1065f05673af5afada579a86b865.jpg" alt="Clyde">
                </div>
                <span class="active-status"><span class="dot"></span>Active now</span>
            </div>
            <div class="story">
                <div class="story-avatar">
                    <img src="https://i.pinimg.com/736x/0a/21/66/0a2166d4b86a2d44d0abea73ca7e9c86.jpg" alt="Kevin">
                </div>
                <span class="active-status"><span class="dot"></span>Active now</span>
            </div>
            <div class="story">
                <div class="story-avatar">
                    <img src="https://i.pinimg.com/736x/08/7b/c8/087bc8f1f0bb6e3c7026596d6eb49616.jpg" alt="Yvette">
                </div>
                <span class="active-status"><span class="dot"></span>Active now</span>
            </div>
            <div class="story">
                <div class="story-avatar">
                    <img src="https://i.pinimg.com/736x/bd/7b/e5/bd7be5d8d7838d2fb4f9d01b6d775286.jpg" alt="Chloe">
                </div>
                <span class="active-status"><span class="dot"></span>Active now</span>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-make-friends">Make friends</button>
            <button class="btn-search" onclick="openSearch()">
                <i class="fas fa-search"></i>
                <span>Search</span>
            </button>
        </div>

        <!-- MAY PADDING PARA KITA YUNG BORDER -->
        <div class="card-container">
            <div class="profile-card">
                <div class="card-image">
                    <img src="https://i.pinimg.com/736x/43/0f/0d/430f0d7c91e0032a1cbadc7e7b7c5fee.jpg" alt="Kezia">
                </div>

                <div class="card-actions">
                    <button class="action-btn like-btn" onclick="showMatch()">
                        <i class="far fa-heart"></i>
                    </button>
                    <button class="action-btn message-btn" onclick="alert('Message clicked')">
                        <i class="far fa-comment"></i>
                    </button>
                    <button class="action-btn dismiss-btn" onclick="alert('Dismiss clicked')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="user-info">
                    <img src="https://i.pinimg.com/736x/43/0f/0d/430f0d7c91e0032a1cbadc7e7b7c5fee.jpg" alt="Avatar" class="user-avatar-small">
                    <div class="user-details">
                        <span class="username">kezia</span>
                        <i class="fas fa-check-circle verified"></i>
                    </div>
                </div>

                <!-- MATCH POPUP -->
                <div class="match-overlay" id="matchOverlay">
                    <div class="match-content-box">
                        <div class="match-title">It's a Match!</div>
                        <div class="match-avatars">
                            <img src="https://i.pinimg.com/736x/43/0f/0d/430f0d7c91e0032a1cbadc7e7b7c5fee.jpg" alt="You">
                            <div class="match-heart">
                                <i class="fas fa-heart"></i>
                            </div>
                            <img src="https://i.pinimg.com/736x/4f/4a/80/4f4a80040437d1cd400a2b5d4e0ae5a4.jpg" alt="Match">
                        </div>
                        <div class="match-text-small">You and Kurt liked each other!</div>
                        <button class="continue-btn" onclick="hideMatch()">Keep Swiping</button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active"><i class="fas fa-home"></i></button>
            <a href="/EMAIL CODE/discover/discover.html"><button class="nav-item"><i class="far fa-compass"></i></button></a>
            <button class="nav-item match-item">
                <a href="/M_Trial3/index.html">
                    <div class="match-icon">
                    <div class="match-fallback" id="matchFallback">
                        <i class="fas fa-fire"></i>
                    </div>
                    <video class="match-video-icon" id="matchVideo" autoplay loop muted playsinline style="display: none;">
                        <source src="https://cdn-icons-mp4.flaticon.com/512/13099/13099799.mp4" type="video/mp4">
                    </video>
                    <span class="match-text">Match-me</span>
                </div>
                </a>
            </button>
            <a href="/matches/index.html"><button class="nav-item"><i class="fas fa-user-friends"></i></button></a>
            <a href="/messages/message.html">
                <button class="nav-item"><i class="far fa-comment-dots"></i></button>
            </a>
        </nav>
    </div>

 <script src="dashboard.js"></script>
</body>
</html>
