<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soulence Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-container">
    <div class="background">
      <div class="content-box">
        <div class="left-panel">
          <div class="overlay"></div>
          <div class="circle top-right"></div>
          <div class="circle bottom-left"></div>
          <div class="left-content">
            <h1 class="logo-text">SOULENCE</h1>
            <p class="tagline">Find Your Perfect Match</p>
            <img src="/image/soulence_logo.png" alt="Profile" class="profile-img">

            <div class="features">
              <p>❤️Meaningful Connections</p>
              <p>🔒Safe & Secure</p>
              <p>✔️Verified Profiles</p>
            </div>
          </div>
        </div>

        <div class="right-panel">
          <div class="login-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to continue your journey</p>

            <form>
              <label>Email Address</label>
              <input type="email" placeholder="Enter your email">

              <label>Password</label>
              <input type="password" placeholder="Enter your password">

              <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
              </div>

              <button class="sign-in-btn">Sign In</button>
            </form>

            <div class="divider">
              <span>or continue with</span>
            </div>

            <div class="social-buttons">
              <button class="google-btn">Continue with Google</button>
              <button class="phone-btn">Continue with Phone Number</button>
            </div>

            <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
