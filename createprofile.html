<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Profile</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background: #f8f8f8;
      font-family: 'Inter', Arial, sans-serif;
      padding: 40px 20px;
    }

    .profile-title {
      text-align: center;
      font-size: 2.25em;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .profile-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 28px;
      font-size: 1.09em;
    }

    .form-label-custom {
      font-weight: 600;
      font-size: 1.15em;
      margin-top: 24px;
      margin-bottom: 10px;
      display: block;
    }

    .form-control-custom {
      padding: 18px 16px;
      border-radius: 16px;
      border: none;
      background: #f6c7f7;
      font-size: 1.2em;
      color: #222;
      /* Center text */
      text-align: center;
    }

    .form-control-custom:focus {
      background: #f6c7f7;
      box-shadow: 0 0 0 3px rgba(234, 32, 220, 0.2);
      border: none;
    }

    .form-control-custom::placeholder {
      color: #9882a3;
      text-align: center;
    }

    /* Gender Buttons */
    .gender-btn {
      width: 100%;
      padding: 18px 0;
      border: none;
      border-radius: 16px;
      background: #f6c7f7;
      color: #181818;
      font-size: 1.13em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }

    .gender-btn:hover {
      background: #ea20dc;
      color: white;
    }

    .gender-btn.selected {
      background: #ea20dc;
      color: white;
    }

    @media (max-width: 650px) {
      body {
        padding: 20px 16px;
      }
      .profile-title {
        font-size: 1.5em;
      }
      .form-control-custom {
        font-size: 1em;
        padding: 14px 11px;
      }
      .gender-btn {
        padding: 14px 0;
        font-size: 1em;
      }
      .form-label-custom {
        font-size: 1em;
      }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <h1 class="profile-title">Start to Create Your Profile</h1>
    <p class="profile-subtitle">Once you confirmed, birthday and gender cannot be changed.</p>

    <form autocomplete="off">
      <!-- Name Field -->
      <label class="form-label-custom">Your name</label>
      <input type="text" class="form-control form-control-custom" required />

      <!-- Birthday Field with Date Picker -->
      <label class="form-label-custom">Your Birthday</label>
      <input type="date" id="birthday" class="form-control form-control-custom" required />

      <!-- Gender Selection -->
      <label class="form-label-custom">Which gender best describes you?</label>
      <div class="row g-3">
        <div class="col-6">
          <button type="button" class="gender-btn" data-gender="Female">Female</button>
        </div>
        <div class="col-6">
          <button type="button" class="gender-btn" data-gender="Male">Male</button>
        </div>
      </div>

      <!-- Start Button -->
      <a href="/EMAIL CODE/Tags/tags.html">
        <div class="text-center mt-4">
        <button type="button" class="btn btn-success btn-lg" onclick="start()">Start</button>
      </div>
      </a>
    </form>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External JavaScript -->
  <script src="createprofile.js"></script>
</body>
</html>
