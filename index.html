<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Phone Verification - Soulence</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
  
  <style>
    :root {
      --gradient-primary: linear-gradient(135deg, #FF6B6B 0%, #EC4899 50%, #9333EA 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Floating shapes */
    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite ease-in-out;
    }

    .shape-1 { width: 300px; height: 300px; top: -150px; left: -100px; }
    .shape-2 { width: 200px; height: 200px; top: 50%; right: -100px; animation-delay: 5s; }
    .shape-3 { width: 150px; height: 150px; bottom: -50px; left: 30%; animation-delay: 10s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }

    .phone-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
    }

    /* Header */
    .phone-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .logo-icon i {
      font-size: 2rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: white;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      letter-spacing: 2px;
    }

    .welcome-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* Steps Indicator */
    .steps-indicator {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .step.active {
      color: white;
    }

    .step-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .step.active .step-number {
      background: white;
      color: #9333EA;
    }

    /* Form Styles */
    .phone-form {
      width: 100%;
    }

    .form-label-custom {
      display: block;
      font-weight: 600;
      color: white;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* FIXED: Country Code with + visible */
    .phone-input-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .country-code-wrapper {
      position: relative;
      width: 90px;
    }

    .country-code {
      width: 100%;
      padding: 0.875rem 0.5rem 0.875rem 1.8rem;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.95);
      font-size: 0.95rem;
      font-weight: 600;
      color: #9333EA;
      cursor: pointer;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    .country-code:focus {
      border-color: white;
      background: white;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
      outline: none;
    }

    /* + sign positioned absolutely */
    .plus-sign {
      position: absolute;
      left: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9333EA;
      font-weight: 600;
      font-size: 0.95rem;
      pointer-events: none;
    }

    /* Dropdown arrow */
    .dropdown-arrow {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9333EA;
      font-size: 0.7rem;
      pointer-events: none;
    }

    .phone-input-wrapper {
      flex: 1;
      position: relative;
    }

    .input-icon-custom {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9333EA;
      font-size: 1.1rem;
      z-index: 10;
    }

    .form-control-custom {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 3rem;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.95);
      font-size: 1rem;
      transition: all 0.2s ease;
      color: #262c38;
    }

    .form-control-custom:focus {
      border-color: white;
      background: white;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
      outline: none;
    }

    .form-control-custom::placeholder {
      color: #a0a0a0;
    }

    /* OTP Section */
    .otp-section {
      margin-bottom: 1.5rem;
    }

    .otp-label {
      display: block;
      font-weight: 600;
      color: white;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .otp-input {
      width: 50px;
      height: 56px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      font-size: 1.5rem;
      font-weight: 700;
      color: #262c38;
      text-align: center;
      transition: all 0.2s ease;
    }

    .otp-input:focus {
      border-color: white;
      background: white;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
      outline: none;
      transform: translateY(-2px);
    }

    /* Timer & Resend */
    .timer-section {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .timer-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .timer-text b {
      color: white;
      font-weight: 700;
    }

    .btn-resend {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 0.625rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-resend:hover:not(:disabled) {
      border-color: white;
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-resend:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: white;
      color: #9333EA;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* FIXED: Back Button Style */
    .back-section {
      text-align: center;
      margin-top: 1.5rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-back:hover {
      color: white;
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
    }

    .btn-back i {
      font-size: 0.9rem;
    }

    /* SweetAlert Custom */
    .swal2-popup {
      border-radius: 1rem !important;
      font-family: 'Inter', sans-serif !important;
    }

    .swal2-confirm {
      background: var(--gradient-primary) !important;
      border-radius: 0.75rem !important;
      font-weight: 600 !important;
    }

    /* Loading */
    .spinner-border-custom {
      width: 1.2rem;
      height: 1.2rem;
      border-width: 0.15em;
    }

    /* Responsive */
    @media (max-width: 576px) {
      body {
        padding: 1rem;
      }

      .app-title {
        font-size: 1.5rem;
      }

      .logo-icon {
        width: 60px;
        height: 60px;
      }

      .logo-icon i {
        font-size: 1.75rem;
      }

      .country-code-wrapper {
        width: 85px;
      }

      .country-code {
        padding: 0.875rem 0.4rem 0.875rem 1.6rem;
        font-size: 0.9rem;
      }

      .otp-input {
        width: 44px;
        height: 50px;
        font-size: 1.25rem;
      }
    }

    @media (max-width: 375px) {
      .otp-inputs {
        gap: 0.5rem;
      }

      .otp-input {
        width: 40px;
        height: 46px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Floating Background -->
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Main Wrapper -->
  <div class="phone-wrapper">
    <!-- Header -->
    <div class="phone-header">
      <div class="logo-icon">
        <i class="fa-solid fa-mobile-screen"></i>
      </div>
      <h1 class="app-title">SOULENCE</h1>
      <p class="welcome-text" id="stepText">Verify your phone number</p>
    </div>

    <!-- Steps Indicator -->
    <div class="steps-indicator">
      <div class="step active" id="step1Indicator">
        <div class="step-number">1</div>
        <span>Phone</span>
      </div>
      <div class="step" id="step2Indicator">
        <div class="step-number">2</div>
        <span>Verify</span>
      </div>
    </div>

    <!-- STEP 1: Phone Number Input -->
    <form class="phone-form" id="phoneForm" autocomplete="off">
      <label for="phone" class="form-label-custom">Phone Number</label>
      <div class="phone-input-group">
        <!-- FIXED: Country Code with + sign visible -->
        <div class="country-code-wrapper">
          <span class="plus-sign">+</span>
          <select class="country-code" id="countryCode">
            <option value="63">63</option>
            <option value="1">1</option>
            <option value="44">44</option>
            <option value="61">61</option>
            <option value="65">65</option>
            <option value="81">81</option>
          </select>
          <span class="dropdown-arrow"><i class="fa-solid fa-chevron-down"></i></span>
        </div>
        <div class="phone-input-wrapper">
          <span class="input-icon-custom"><i class="fa-solid fa-phone"></i></span>
          <input 
            type="tel" 
            id="phone" 
            class="form-control-custom" 
            placeholder="912 345 6789" 
            maxlength="12"
          >
        </div>
      </div>

      <button type="submit" class="btn-submit" id="sendCodeBtn">
        <span>Send Code</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

    <!-- STEP 2: OTP Verification (Hidden by default) -->
    <form class="phone-form d-none" id="otpForm" autocomplete="off">
      <div class="otp-section">
        <label class="otp-label">Enter 6-digit code</label>
        <div class="otp-inputs">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp1">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp2">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp3">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp4">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp5">
          <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp6">
        </div>
      </div>

      <div class="timer-section">
        <p class="timer-text" id="timerText">Code expires in <b id="seconds">60</b> seconds</p>
        <button type="button" class="btn-resend" id="resendBtn" disabled>
          <i class="fa-solid fa-rotate-right"></i>
          Resend Code
        </button>
      </div>

      <button type="submit" class="btn-submit" id="verifyBtn">
        <span>Verify & Login</span>
        <i class="fa-solid fa-check"></i>
      </button>
    </form>

    <!-- FIXED: Back Button with proper style -->
    <div class="back-section">
      <a href="#" class="btn-back" id="backBtn">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to login</span>
      </a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>

  <script>
    // DOM Elements
    const phoneForm = document.getElementById('phoneForm');
    const otpForm = document.getElementById('otpForm');
    const phoneInput = document.getElementById('phone');
    const countryCode = document.getElementById('countryCode');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const step1Indicator = document.getElementById('step1Indicator');
    const step2Indicator = document.getElementById('step2Indicator');
    const stepText = document.getElementById('stepText');
    const timerText = document.getElementById('timerText');
    const secondsDisplay = document.getElementById('seconds');
    const backBtn = document.getElementById('backBtn');

    const otpInputs = [
      document.getElementById('otp1'),
      document.getElementById('otp2'),
      document.getElementById('otp3'),
      document.getElementById('otp4'),
      document.getElementById('otp5'),
      document.getElementById('otp6')
    ];

    let timer = 60;
    let timerInterval;
    let canResend = false;

    // Format phone number as user types
    phoneInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 3 && value.length <= 6) {
        value = value.slice(0, 3) + ' ' + value.slice(3);
      } else if (value.length > 6) {
        value = value.slice(0, 3) + ' ' + value.slice(3, 6) + ' ' + value.slice(6, 10);
      }
      e.target.value = value;
    });

    // Step 1: Send Code - SWEETALERT VALIDATION
    phoneForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const phone = phoneInput.value.trim();

      // SWEETALERT: Empty phone validation
      if (!phone) {
        Swal.fire({
          icon: 'warning',
          title: 'Required Field',
          text: 'Please fill out this field',
          confirmButtonText: 'OK',
          confirmButtonColor: '#9333EA',
          background: '#fff',
          backdrop: 'rgba(0, 0, 0, 0.4)'
        });
        phoneInput.focus();
        return;
      }

      // Validation: Invalid phone format
      const phoneDigits = phone.replace(/\s/g, '');
      if (phoneDigits.length < 9) {
        Swal.fire({
          icon: 'error',
          title: 'Invalid Number',
          text: 'Please enter a valid phone number',
          confirmButtonText: 'OK',
          confirmButtonColor: '#9333EA',
          background: '#fff',
          backdrop: 'rgba(0, 0, 0, 0.4)'
        });
        phoneInput.focus();
        return;
      }

      // Loading state
      const originalContent = sendCodeBtn.innerHTML;
      sendCodeBtn.innerHTML = '<span class="spinner-border spinner-border-custom" role="status" aria-hidden="true"></span> Sending...';
      sendCodeBtn.disabled = true;

      // Simulate API call
      setTimeout(() => {
        // Switch to Step 2
        phoneForm.classList.add('d-none');
        otpForm.classList.remove('d-none');
        
        // Update indicators
        step1Indicator.classList.remove('active');
        step2Indicator.classList.add('active');
        
        const fullNumber = '+' + countryCode.value + ' ' + phone;
        stepText.textContent = `Code sent to ${fullNumber}`;

        // Start timer
        startTimer();

        // Focus first OTP input
        otpInputs[0].focus();

        Swal.fire({
          icon: 'success',
          title: 'Code Sent! 📱',
          text: `Verification code sent to ${fullNumber}`,
          confirmButtonText: 'OK',
          confirmButtonColor: '#9333EA',
          background: '#fff',
          backdrop: 'rgba(147, 51, 234, 0.4)',
          timer: 3000,
          timerProgressBar: true
        });

        // Reset button
        sendCodeBtn.innerHTML = originalContent;
        sendCodeBtn.disabled = false;
      }, 1500);
    });

    // OTP Input Handling
    otpInputs.forEach((input, index) => {
      // Only allow numbers
      input.addEventListener('keypress', (e) => {
        if (!/[0-9]/.test(e.key)) {
          e.preventDefault();
        }
      });

      // Auto-focus next input
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1) {
          if (index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          } else {
            verifyBtn.focus();
          }
        }
      });

      // Backspace handling
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });

      // Paste handling
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/[^0-9]/g, '');
        
        if (pastedData) {
          pastedData.split('').forEach((char, i) => {
            if (otpInputs[i]) {
              otpInputs[i].value = char;
            }
          });
          
          const nextEmpty = otpInputs.find(input => !input.value);
          if (nextEmpty) {
            nextEmpty.focus();
          } else {
            otpInputs[otpInputs.length - 1].focus();
          }
        }
      });

      // Select all on focus
      input.addEventListener('focus', () => {
        input.select();
      });
    });

    // Start Timer
    function startTimer() {
      canResend = false;
      resendBtn.disabled = true;
      timer = 60;
      secondsDisplay.textContent = timer;
      timerText.style.display = 'block';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer--;
        secondsDisplay.textContent = timer;

        if (timer <= 0) {
          clearInterval(timerInterval);
          canResend = true;
          resendBtn.disabled = false;
          timerText.innerHTML = 'Code <b>expired</b>. Please resend.';
        }
      }, 1000);
    }

    // Resend Code
    resendBtn.addEventListener('click', () => {
      if (!canResend) return;

      resendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

      setTimeout(() => {
        resendBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Resend Code';
        
        // Clear OTP inputs
        otpInputs.forEach(input => input.value = '');
        otpInputs[0].focus();
        
        startTimer();
        timerText.innerHTML = 'Code expires in <b id="seconds">60</b> seconds';

        Swal.fire({
          icon: 'info',
          title: 'New Code Sent! 📱',
          text: 'A new verification code has been sent',
          confirmButtonColor: '#9333EA',
          timer: 2000,
          timerProgressBar: true,
          background: '#fff'
        });
      }, 1500);
    });

    // Step 2: Verify OTP - SWEETALERT VALIDATION
    otpForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const otp = otpInputs.map(input => input.value).join('');

      // SWEETALERT: Empty OTP validation
      if (!otp) {
        Swal.fire({
          icon: 'warning',
          title: 'Required Field',
          text: 'Please fill out this field',
          confirmButtonText: 'OK',
          confirmButtonColor: '#9333EA',
          background: '#fff',
          backdrop: 'rgba(0, 0, 0, 0.4)'
        });
        otpInputs[0].focus();
        return;
      }

      // Validation: Incomplete OTP
      if (otp.length !== 6) {
        Swal.fire({
          icon: 'warning',
          title: 'Incomplete Code',
          text: 'Please enter all 6 digits',
          confirmButtonText: 'OK',
          confirmButtonColor: '#9333EA',
          background: '#fff',
          backdrop: 'rgba(0, 0, 0, 0.4)'
        });
        return;
      }

      // Loading state
      const originalContent = verifyBtn.innerHTML;
      verifyBtn.innerHTML = '<span class="spinner-border spinner-border-custom" role="status" aria-hidden="true"></span> Verifying...';
      verifyBtn.disabled = true;

      // Simulate API verification
      setTimeout(() => {
        // Success
        Swal.fire({
          icon: 'success',
          title: 'Verified! 🎉',
          text: 'Your phone number has been verified. Welcome to Soulence!',
          confirmButtonText: 'Continue',
          confirmButtonColor: '#9333EA',
          background: '#fff',
          backdrop: 'rgba(147, 51, 234, 0.4)'
        }).then((result) => {
          if (result.isConfirmed) {
            // Redirect to dashboard
            // window.location.href = 'dashboard.html';
            console.log('Redirecting to dashboard...');
          }
        });

        verifyBtn.innerHTML = originalContent;
        verifyBtn.disabled = false;
      }, 2000);
    });

    // Back Button
    backBtn.addEventListener('click', function(e) {
      e.preventDefault();
      
      // If on step 2, go back to step 1
      if (!otpForm.classList.contains('d-none')) {
        otpForm.classList.add('d-none');
        phoneForm.classList.remove('d-none');
        
        step2Indicator.classList.remove('active');
        step1Indicator.classList.add('active');
        stepText.textContent = 'Verify your phone number';
        
        // Clear timer
        clearInterval(timerInterval);
        
        // Clear OTP inputs
        otpInputs.forEach(input => input.value = '');
      } else {
        // Already on step 1, go to login
        Swal.fire({
          icon: 'info',
          title: 'Redirecting...',
          text: 'Going back to login page',
          confirmButtonColor: '#9333EA',
          timer: 1500,
          timerProgressBar: true,
          background: '#fff'
        }).then(() => {
          // window.location.href = 'login.html';
          console.log('Redirecting to login...');
        });
      }
    });
  </script>
</body>
</html>
